[package]
name = "always-on-top"
version = "1.0.0"
description = "A lightweight standalone Windows utility for pinning windows above all others."
authors = ["devbloxstrap"]
edition = "2021"
license = "MIT"

[lib]
name = "always_on_top_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "AlwaysOnTop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
window-vibrancy = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging"
] }
